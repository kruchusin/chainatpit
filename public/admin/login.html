<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<title>เข้าสู่ระบบ | หลังบ้าน</title>
</head>
<body>
<main id="main" class="login-wrap">
<h1>เข้าสู่ระบบหลังบ้าน</h1>
<div class="card-panel">
<p id="login-error" class="alert" role="alert"></p>
<p id="login-notice" class="notice" role="status"></p>
<form id="login-form" novalidate>
<div class="form-field"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="username" required></div>
<div class="form-field"><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div class="form-actions"><button type="submit" class="btn" id="login-btn">เข้าสู่ระบบ</button>
<button type="button" class="btn-link" id="forgot-btn">ลืมรหัสผ่าน</button></div>
</form>
</div>
<p class="center"><a href="/">กลับหน้าเว็บไซต์</a></p>
</main>
<script type="module" src="/assets/js/pages/admin-login.js"></script>
</body>
</html>
